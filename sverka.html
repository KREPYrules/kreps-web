<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>КРЕПЫ — сверка</title>
<style>
  :root {
    --ground:#E7E9E4; --surface:#FAFBF8; --ink:#15181A; --muted:#6E756F;
    --line:#CBD0C8; --accent:#B07908; --crit:#9C3630;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#131614; --surface:#1B1F1C; --ink:#EBEEE9; --muted:#8A928B;
      --line:#2E342F; --accent:#E5B23C; --crit:#D6756D;
    }
  }
  :root[data-theme="dark"] {
    --ground:#131614; --surface:#1B1F1C; --ink:#EBEEE9; --muted:#8A928B;
    --line:#2E342F; --accent:#E5B23C; --crit:#D6756D;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #gate {
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #gate form {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--line); padding: 30px 28px 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .mark {
    font-family: Oswald, Impact, sans-serif; font-weight: 600; font-size: 40px;
    letter-spacing: .12em; line-height: 1; margin: 0 0 2px; text-indent: .12em;
  }
  .sub {
    margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45;
  }
  label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  input {
    width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 0;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 11px 14px; font-family: inherit; font-size: 14.5px; font-weight: 600;
    background: var(--ink); color: var(--ground); border: none; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #err { margin: 0; font-size: 13px; color: var(--crit); min-height: 1.2em; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@600&display=swap">
</head>
<body>
<div id="gate">
  <form id="f">
    <p class="mark">КРЕПЫ</p>
    <p class="sub">Управленческий учёт. Страница закрыта паролем — содержимое хранится в зашифрованном виде.</p>
    <label for="p">Пароль</label>
    <input id="p" type="password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Открыть</button>
    <p id="err"></p>
  </form>
</div>

};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("b");
  const err = document.getElementById("err");
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Расшифровываю…";
  try {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(document.getElementById("p").value),
      "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(DATA.salt), iterations: 250000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
    document.body.innerHTML = new TextDecoder().decode(plain);
    // Скрипты, вставленные через innerHTML, браузер не выполняет.
    // Пересоздаём их, иначе интерактивные отчёты остаются пустыми.
    for (const old of [...document.body.querySelectorAll("script")]) {
      const s = document.createElement("script");
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
    const t = document.body.querySelector("title");
    if (t) document.title = t.textContent;
  } catch (_) {
    err.textContent = "Неверный пароль";
    btn.disabled = false;
    btn.textContent = "Открыть";
  }
});
})();
